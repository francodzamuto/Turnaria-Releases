name: Verificar canal latest de Turnaria

on:
  push:
    branches:
      - main
    paths:
      - VERIFY_TRIGGER.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar latest.yml e instaladores públicos
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c 'import json; print(json.load(open("VERIFY_TRIGGER.json", encoding="utf-8"))["version"])')"
          base="https://github.com/francodzamuto/Turnaria-Releases/releases/latest/download"
          curl --fail --location --silent --show-error "$base/latest.yml" -o /tmp/latest.yml
          actual="$(awk '/^version:[[:space:]]*/ {print $2; exit}' /tmp/latest.yml | tr -d "\r\047\042")"
          if [ "$actual" != "$expected" ]; then
            echo "latest.yml anuncia $actual y se esperaba $expected"
            exit 1
          fi
          installer="$(awk '/^path:[[:space:]]*/ {sub(/^path:[[:space:]]*/, ""); gsub(/[\r\047\042]/, ""); print; exit}' /tmp/latest.yml)"
          if [ -z "$installer" ]; then
            echo "latest.yml no contiene path"
            exit 1
          fi
          curl --fail --location --silent --show-error --head "$base/$installer" >/dev/null
          curl --fail --location --silent --show-error --head "$base/Turnaria-Setup.exe" >/dev/null
          mkdir -p verified
          python - <<'PY'
          import json, os, datetime
          with open('VERIFY_TRIGGER.json', encoding='utf-8') as f:
              trigger = json.load(f)
          version = trigger['version']
          payload = {
              'version': version,
              'verified': True,
              'channel': 'releases/latest/download',
              'verifiedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          with open(f'verified/v{version}.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Guardar verificación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified/
          git diff --cached --quiet && exit 0
          git commit -m "Verificar canal latest de Turnaria"
          git push
